<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="script.js" defer></script>
    <title>Tic-Tac-Toe</title>
  </head>
  <body>
    <div class="main">
      <div class="players-prompts">
        <div class="game-status hidden"><h1 class="message"></h1></div>
        <form class="players-prompts-form">
          <label for="player1-name">Player 1 Name</label><br />
          <input
            type="text"
            id="player1-name"
            name="player1-name"
            value="Player 1"
          /><br />

          <label for="player2-name">Player 2 Name</label><br />
          <input
            type="text"
            id="player2-name"
            name="player2-name"
            value="Player 2"
          />
        </form>
        <div class="control-buttons">
          <button class="start-btn" type="button">start</button>
          <button class="reset-btn hidden" type="button">reset</button>
        </div>
      </div>
      <div class="gameBoard-grid">
        <div class="cell 0,0">
          <button class="boardcellbutton" id="0,0" data-value="0,0"></button>
        </div>
        <div class="cell 0,1">
          <button class="boardcellbutton" id="0,1" data-value="0,1"></button>
        </div>
        <div class="cell 0,2">
          <button class="boardcellbutton" id="0,2" data-value="0,2"></button>
        </div>
        <div class="cell 1,0">
          <button class="boardcellbutton" id="1,0" data-value="1,0"></button>
        </div>
        <div class="cell 1,1">
          <button class="boardcellbutton" id="1,1" data-value="1,1"></button>
        </div>
        <div class="cell 1,2">
          <button class="boardcellbutton" id="1,2" data-value="1,2"></button>
        </div>
        <div class="cell 2,0">
          <button class="boardcellbutton" id="2,0" data-value="2,0"></button>
        </div>
        <div class="cell 2,1">
          <button class="boardcellbutton" id="2,1" data-value="2,1"></button>
        </div>
        <div class="cell 2,2">
          <button class="boardcellbutton" id="2,2" data-value="2,2"></button>
        </div>
      </div>
    </div>
  </body>
</html>
